<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ridge — the network reporting</title>
<link rel="stylesheet" href="scene.css">
<style>
  body { align-content: stretch; padding: 5% 6%; grid-template-rows: auto 1fr; gap: 3%; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 1em; }
  .count { font-size: clamp(26px, 4.4vw, 54px); font-weight: 600; line-height: 1;
           letter-spacing: -0.015em; }
  .of { color: var(--ink-secondary); font-weight: 400; }
  .map { position: relative; min-height: 0; }
  svg { display: block; width: 100%; height: 100%; }
  .ring  { fill: none; stroke: var(--accent); stroke-width: 1.5;
           filter: drop-shadow(0 0 8px rgb(10 8 7 / 0.9)); }
  .site  { fill: color-mix(in srgb, var(--ink) 30%, transparent);
           filter: drop-shadow(0 0 8px rgb(10 8 7 / 0.9)); }
  .site.on { fill: var(--accent); }
  @media (max-aspect-ratio: 1/1) {
    .head { display: block; }
    .head > span { display: block; }
    .count { font-size: 34px; margin-top: 0.25em; }
  }
</style>
</head>
<body>
  <div class="bed"><img src="../media/slide-sea.webp" alt=""></div>
  <div class="head">
    <span class="label">Network &middot; reporting</span>
    <span class="count readout"><span id="n">0</span><span class="of">&thinsp;/&thinsp;14</span></span>
  </div>
  <div class="map" id="map"><svg id="svg" aria-hidden="true"></svg></div>

<script>
// Fourteen stations, placed by hand in a 0-1 box so the layout is the same at
// every crop: the caldera rim, the rift running south-west, two coastal pairs.
const SITES = [
  [0.46,0.30],[0.53,0.26],[0.59,0.33],[0.63,0.42],[0.57,0.47],[0.49,0.44],[0.42,0.38],
  [0.70,0.52],[0.76,0.61],[0.83,0.70],[0.89,0.80],
  [0.30,0.52],[0.22,0.64],[0.14,0.74],
];
const ORIGIN = [0.53, 0.37];           // the summit: the sweep starts there
const SQUASH = 0.62;        // the contours are this much flatter than wide
const svg = document.getElementById("svg"), map = document.getElementById("map");
let placed = [], ring, rmax = 1;

function layout() {
  const w = map.clientWidth, h = map.clientHeight;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const px = ([x, y]) => [x * w, y * h];
  const [ox, oy] = px(ORIGIN);
  let out = "";
  // three faint contours, so the dots sit on terrain rather than on nothing
  for (const r of [0.16, 0.30, 0.46]) {
    out += `<ellipse class="hair" fill="none" cx="${ox}" cy="${oy}" rx="${r * w}" ry="${r * w * SQUASH}"></ellipse>`;
  }
  out += `<ellipse id="sweep" class="ring" cx="${ox}" cy="${oy}" rx="0" ry="0"></ellipse>`;
  // The sweep is the same ellipse as the contours, so it reads as the terrain
  // being covered rather than a circle drawn over a map. Distance is measured
  // in that ellipse's own metric: a station is reached when the contour
  // passing through it has been crossed.
  placed = SITES.map(px).map(([x, y], i) =>
    ({ x, y, d: Math.hypot(x - ox, (y - oy) / SQUASH), i }));
  // overshoot, so even the farthest station finishes its settle inside the clip
  rmax = Math.max(...placed.map((p) => p.d)) * 1.10;
  out += placed.map((p) => `<circle class="site" cx="${p.x}" cy="${p.y}" r="4"></circle>`).join("");
  svg.innerHTML = out;
  ring = document.getElementById("sweep");
}

const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const clamp01 = (x) => Math.min(1, Math.max(0, x));

window.setFrame = function (t) {
  // a quadratic, not a cubic: a cubic has covered nine stations in the first
  // half second and the rest of the clip is a held frame
  const x = clamp01(t / 0.88), p = 1 - (1 - x) * (1 - x);
  const r = p * rmax;
  ring.setAttribute("rx", r.toFixed(2));
  ring.setAttribute("ry", (r * SQUASH).toFixed(2));
  ring.style.opacity = (0.55 * (1 - clamp01((t - 0.70) / 0.25))).toFixed(3);
  let on = 0;
  svg.querySelectorAll(".site").forEach((el, i) => {
    const hit = placed[i].d <= r;
    el.classList.toggle("on", hit);
    // the dot grows for a moment as the sweep passes it, then settles
    const age = hit ? clamp01((r - placed[i].d) / (rmax * 0.07)) : 0;
    el.setAttribute("r", (4 + 2.5 * Math.sin(age * Math.PI)).toFixed(2));
    if (hit) on++;
  });
  document.getElementById("n").textContent = on;
};

layout();
addEventListener("resize", () => { layout(); window.setFrame(0); });
window.setFrame(0);
</script>
</body>
</html>
